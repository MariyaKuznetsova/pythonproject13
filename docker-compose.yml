#version: '3.11'

services:
    nginx:
        build:
            context: nginx/
        ports:
            - "80:80"
        volumes:
            - ./nginx/nginx.conf:/etc/nginx/nginx.conf
        depends_on:
            - web


    web:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: materials
        command:
            bash -c "python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
        ports:
            - "8000:8000"
        env_file:
            - ./.env
        volumes:
            - .:/code
            - static_volume:/code/static
        depends_on:
            - db
            - redis

    db:
        image: postgres:17
        container_name: postgres_db
        env_file:
            - ./.env
        ports:
          - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data

    redis:
        image: redis:latest
        container_name: redis
        ports:
            - "6379:6379"
        env_file:
            - ./.env
        volumes:
            - redis_data:/data
    celery:
        build:
            context: .
        container_name: celery_worker
        command:
            celery -A config worker -l INFO
        env_file:
            - ./.env
        volumes:
            - .:/app
        depends_on:
            - db
            - redis

    celery_beat:
        build:
            context: .
        container_name: celery_beat
        command:
            celery -A config beat --loglevel=INFO
        env_file:
            - ./.env
        volumes:
            - .:/app
        depends_on:
            - db
            - redis
            - celery
networks:
    app_network:
        driver: bridge
volumes:
    postgres_data:
    redis_data:
    static_volume:




